name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Unit and component tests
        run: bun run test:unit --run
      - name: End-to-end tests (mock API + production build)
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg ORIGIN=http://localhost:3000 -t vacatime-frontend frontend
      - name: Smoke test
        run: |
          docker run -d --name web -p 3000:3000 vacatime-frontend
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -sf http://localhost:3000/login | grep -q '<html'
          docker rm -f web
