services:
  postgres:
    image: 'postgres:alpine'
    environment:
      - 'POSTGRES_DB=vacatime'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-vacatime}'
      - 'POSTGRES_USER=${DB_USER:-vacatime}'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vacatime -d vacatime']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vacatime
      DB_USER: ${DB_USER:-vacatime}
      DB_PASSWORD: ${DB_PASSWORD:-vacatime}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in backend/.env}"
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  postgres-data:
