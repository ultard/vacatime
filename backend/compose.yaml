services:
  postgres:
    image: 'postgres:alpine'
    environment:
      - 'POSTGRES_DB=vacatime'
      - 'POSTGRES_PASSWORD=vacatime'
      - 'POSTGRES_USER=vacatime'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vacatime -d vacatime']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vacatime
      DB_USER: vacatime
      DB_PASSWORD: vacatime
    ports:
      - '8080:8080'

volumes:
  postgres-data:
