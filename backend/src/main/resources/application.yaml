spring:
  application:
    name: vacatime
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vacatime}
    username: ${DB_USER:vacatime}
    password: ${DB_PASSWORD:vacatime}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml
  docker:
    compose:
      enabled: false
  web:
    error:
      include-message: never
app:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: 15
    refresh-days: 14
  security:
    max-failed-attempts: 5
    lock-minutes: 15
