<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe2b0"/>
			<stop offset="1" stop-color="#ffb787"/>
		</linearGradient>
		<radialGradient id="sun" cx="0.5" cy="0.62" r="0.62">
			<stop offset="0" stop-color="#ffe066"/>
			<stop offset="0.55" stop-color="#ffb43c"/>
			<stop offset="1" stop-color="#f2752c"/>
		</radialGradient>
		<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a8aa8"/>
			<stop offset="1" stop-color="#175f78"/>
		</linearGradient>
		<clipPath id="window">
			<path d="M10 25h44v25.5c0 3-2.4 5.5-5.4 5.5H15.4C12.4 56 10 53.5 10 50.5z"/>
		</clipPath>
	</defs>

	<!-- the tear-off page, slightly tilted like it was pinned by hand -->
	<g transform="rotate(-3 32 34)">
		<path d="M8.5 13.5c0-3.3 2.6-5.8 5.9-5.8h35.3c3.2 0 5.8 2.6 5.8 5.8v40.2c0 3.6-2.9 6.4-6.4 6.4H14.6c-3.4 0-6.1-2.7-6.1-6.1z" fill="#fbf4e6" stroke="#22303f" stroke-width="2"/>
		<!-- header band with the month "ink" -->
		<path d="M9.5 13.6c0-2.8 2.2-4.9 4.9-4.9h35.3c2.7 0 4.8 2.2 4.8 4.8V22H9.5z" fill="#1f6f8b"/>
		<path d="M21 16.2c4.3-.7 9.6-.9 13.8-.4m-13.6 2.6c2.6-.3 5.4-.4 7.9-.2" stroke="#fbf4e6" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>

		<!-- sunset scene printed on the page -->
		<g clip-path="url(#window)">
			<rect x="8" y="24" width="48" height="34" fill="url(#sky)"/>
			<g stroke="#f58a3d" stroke-width="1.7" stroke-linecap="round" opacity="0.9">
				<path d="M32 28.2v2.6"/>
				<path d="M23.6 31.2l1.6 2"/>
				<path d="M40.4 31.2l-1.6 2"/>
				<path d="M18.6 37.4l2.4.8"/>
				<path d="M45.4 37.4l-2.4.8"/>
			</g>
			<circle cx="32" cy="43.5" r="8.6" fill="url(#sun)"/>
			<path d="M8 43.8c3.6-1.6 6.4 1.3 10.1-.1 3.4-1.3 5.8-1.9 9.5-.3 3.4 1.5 6.3 1.2 9.7-.2 3.6-1.5 6.5-.9 9.9.4 2.8 1 5 .5 6.8-.3V58H8z" fill="url(#sea)"/>
			<path d="M12.5 49.4c2.6-1.1 4.6.8 7.4-.1 2.7-.9 4.5-.4 6.9.4m6.2.1c2.4-.9 4.4.6 7 0 2.3-.6 4.3-.9 6.6.2" stroke="#bfe6ef" stroke-width="1.5" stroke-linecap="round" fill="none"/>
			<path d="M28.2 46.4c1.3-.5 2.6-.5 3.9 0 1.2.4 2.4.4 3.6 0" stroke="#ffd27a" stroke-width="1.3" stroke-linecap="round" fill="none"/>
		</g>

		<!-- dog-eared corner -->
		<path d="M55.5 49.2v4.5c0 3.6-2.9 6.4-6.4 6.4h-4.6z" fill="#e7d6b8" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
	</g>

	<!-- binder rings -->
	<g stroke="#22303f" stroke-width="2" fill="#c9d3dc">
		<rect x="18.5" y="3.5" width="5.5" height="11" rx="2.75"/>
		<rect x="39.5" y="2.5" width="5.5" height="11" rx="2.75"/>
	</g>
	<path d="M20.4 5.6v5m21-6v5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
